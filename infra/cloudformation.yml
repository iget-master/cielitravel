AWSTemplateFormatVersion: "2010-09-09"
Description: >
  cielitravel — site estático em S3 (privado) servido pelo CloudFront (CDN).
  Deploy:  aws cloudformation deploy --template-file infra/cloudformation.yml
           --stack-name cielitravel-site --parameter-overrides BucketName=<nome>

Parameters:
  BucketName:
    Type: String
    Default: cielitravel-site
    Description: Nome do bucket S3 (globalmente único)

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Reescreve /toscana/ -> /toscana/index.html (S3 não faz isso sozinho)
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${BucketName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Reescreve URIs de diretorio para index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            req.uri = uri + '/index.html';
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: cielitravel site estatico
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100   # EUA/Europa (mais barato; inclui borda BR? não — All se quiser POPs no Brasil)
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        # Para usar o domínio cielitravel.com depois:
        #   1. Criar certificado ACM em us-east-1 para cielitravel.com
        #   2. Descomentar abaixo e apontar o DNS (CNAME/alias) p/ o CloudFront
        # Aliases:
        #   - cielitravel.com
        #   - www.cielitravel.com
        # ViewerCertificate:
        #   AcmCertificateArn: arn:aws:acm:us-east-1:<conta>:certificate/<id>
        #   MinimumProtocolVersion: TLSv1.2_2021
        #   SslSupportMethod: sni-only

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteURL:
    Description: URL do site na CDN
    Value: !Sub "https://${Distribution.DomainName}"
